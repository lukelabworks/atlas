<style>
:root {
  color-scheme: light;
  --paper: #f7f3ed;
  --paper-2: #efeae0;
  --paper-3: #e6dfd1;
  --ink: #15252c;
  --ink-2: #243640;
  --muted: #56646c;
  --muted-2: #7a8890;
  --teal: #155564;
  --teal-deep: #0e4050;
  --rust: #a04832;
  --rust-deep: #76321f;
  --gold: #a87a2e;
  --gold-soft: #f0e5cc;
  --olive: #5a6a32;
  --olive-soft: #e5e8d4;
  --plum: #5a3a60;
  --plum-soft: #ebdfee;
  --line: #cabea9;
  --line-soft: #ddd2bd;
  --shadow: 0 1px 2px rgba(26, 42, 50, 0.04), 0 4px 16px rgba(26, 42, 50, 0.06);
  --shadow-card: 0 2px 4px rgba(26, 42, 50, 0.05), 0 8px 24px rgba(26, 42, 50, 0.08);
  --radius: 14px;
  --radius-sm: 8px;
  --serif: 'Fraunces', Georgia, serif;
  --sans: 'Inter', -apple-system, sans-serif;
  --mono: 'JetBrains Mono', ui-monospace, monospace;
}

* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; padding: 0; background: var(--paper); color: var(--ink); font-family: var(--sans); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }

/* Force light-mode rendering regardless of OS preference.
   The app's earthy paper palette is designed for light mode only. */
@media (prefers-color-scheme: dark) {
  :root {
    color-scheme: light !important;
    --paper: #f7f3ed;
    --paper-2: #efeae0;
    --paper-3: #e6dfd1;
    --ink: #15252c;
    --ink-2: #243640;
    --muted: #56646c;
    --muted-2: #7a8890;
  }
  html, body { background: #f7f3ed !important; color: #15252c !important; }
}
body {
  background-image:
    radial-gradient(circle at 20% 10%, rgba(198, 149, 64, 0.06), transparent 40%),
    radial-gradient(circle at 80% 90%, rgba(26, 102, 120, 0.05), transparent 50%);
  min-height: 100vh;
  min-height: 100dvh;
  padding-bottom: env(safe-area-inset-bottom);
}
button { font-family: inherit; cursor: pointer; border: none; background: none; padding: 0; color: inherit; }

/* App shell */
.app { max-width: 480px; margin: 0 auto; min-height: 100dvh; padding-bottom: 88px; position: relative; }

/* Header */
.app-header { padding: calc(env(safe-area-inset-top) + 14px) 20px 18px; position: relative; }
.header-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.trip-switch { display: inline-flex; align-items: center; gap: 8px; padding: 6px 12px 6px 8px; background: var(--paper-2); border-radius: 999px; font-size: 13px; color: var(--ink-2); border: 0.5px solid var(--line); cursor: pointer; font-weight: 500; }
.trip-switch:hover { background: var(--paper-3); }
.trip-switch .badge { background: var(--teal); color: var(--paper); border-radius: 999px; padding: 2px 8px; font-size: 10px; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 600; }
.trip-switch .icon { width: 14px; height: 14px; color: var(--muted); }
.header-icon { width: 38px; height: 38px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--paper-2); border: 0.5px solid var(--line); font-size: 18px; color: var(--ink-2); }

.page-title { font-family: var(--serif); font-size: 34px; line-height: 1; font-weight: 500; letter-spacing: -0.02em; margin: 18px 0 4px; font-variation-settings: 'opsz' 144; }
.page-sub { color: var(--muted); font-size: 13px; margin: 0; font-weight: 400; }

/* Day nav */
.day-nav { display: flex; align-items: center; gap: 8px; margin: 14px 0 0; }
.day-nav-main { flex: 1; text-align: center; min-width: 0; }
.day-nav-main .page-title { margin: 0 0 4px; font-size: 30px; }
.day-nav-main .page-sub { font-size: 12px; }
.day-nav-btn { width: 44px; height: 44px; border-radius: 50%; display: flex; align-items: center; justify-content: center; background: var(--paper); border: 1px solid var(--line); font-size: 20px; color: var(--ink); flex-shrink: 0; transition: all 0.15s; box-shadow: var(--shadow); }
.day-nav-btn:hover:not(:disabled) { background: var(--paper-2); transform: scale(1.04); }
.day-nav-btn:active:not(:disabled) { transform: scale(0.96); }
.day-nav-btn:disabled { opacity: 0.25; cursor: not-allowed; box-shadow: none; }
.day-today-link { display: inline-flex; align-items: center; gap: 4px; margin-top: 8px; font-size: 11px; color: var(--teal); padding: 4px 10px; border-radius: 999px; background: rgba(21, 85, 100, 0.08); font-weight: 500; }
.day-today-link .icon { width: 12px; height: 12px; }

/* Sections */
.section { margin: 24px 0; }
.section-label { display: flex; align-items: center; gap: 10px; padding: 0 20px; margin-bottom: 10px; }
.section-label .line { flex: 1; height: 0.5px; background: var(--line); }
.section-label .label { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }

/* Hero card on home */
.hero-card { margin: 0 20px; background: var(--ink); color: var(--paper); border-radius: var(--radius); padding: 20px 22px; position: relative; overflow: hidden; box-shadow: var(--shadow-card); }
.hero-card::after { content: ''; position: absolute; right: -20px; top: -20px; width: 120px; height: 120px; background: radial-gradient(circle, rgba(198, 149, 64, 0.25), transparent 70%); border-radius: 50%; pointer-events: none; }
.hero-card .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 0.12em; text-transform: uppercase; opacity: 0.65; }
.hero-card .what { font-family: var(--serif); font-size: 24px; line-height: 1.15; font-weight: 500; margin-top: 8px; letter-spacing: -0.01em; }
.hero-card .when { font-size: 13px; opacity: 0.75; margin-top: 8px; }
.hero-card .actions { display: flex; gap: 8px; margin-top: 14px; position: relative; z-index: 1; }
.hero-card .actions button { padding: 7px 12px; font-size: 12px; background: rgba(255,255,255,0.12); border-radius: 999px; color: var(--paper); border: 0.5px solid rgba(255,255,255,0.2); font-weight: 500; display: inline-flex; align-items: center; gap: 5px; }
.hero-card .actions button:hover { background: rgba(255,255,255,0.18); }

/* Quick stats */
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; padding: 0 20px; }
.stat { background: var(--paper-2); padding: 12px; border-radius: var(--radius-sm); border: 0.5px solid var(--line-soft); }
.stat-tappable { cursor: pointer; transition: all 0.15s; }
.stat-tappable:hover { background: var(--paper-3); }
.stat-tappable:active { transform: scale(0.97); }
.stat-val { font-family: var(--serif); font-size: 20px; font-weight: 500; letter-spacing: -0.01em; }
.stat-lbl { font-size: 10px; color: var(--muted); margin-top: 2px; text-transform: uppercase; letter-spacing: 0.06em; font-weight: 500; }

/* Activity rows */
.activity-list { padding: 0 20px; }
.activity { display: flex; align-items: flex-start; gap: 14px; padding: 14px 0; border-bottom: 0.5px solid var(--line-soft); cursor: pointer; position: relative; }
.activity:last-child { border-bottom: none; }
.activity:hover { background: var(--paper-2); margin: 0 -8px; padding: 14px 8px; border-radius: var(--radius-sm); border-bottom-color: transparent; }
.activity:hover + .activity { border-top: 0.5px solid var(--line-soft); margin-top: -0.5px; }
.activity-icon { width: 36px; height: 36px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 16px; background: var(--paper-2); color: var(--ink-2); }
.activity-icon.teal { background: rgba(26, 102, 120, 0.1); color: var(--teal-deep); }
.activity-icon.rust { background: rgba(184, 90, 62, 0.12); color: var(--rust-deep); }
.activity-icon.gold { background: var(--gold-soft); color: #8a6020; }
.activity-icon.olive { background: var(--olive-soft); color: #4d5a2a; }
.activity-icon.plum { background: var(--plum-soft); color: var(--plum); }
.activity-main { flex: 1; min-width: 0; }
.activity-title { font-size: 14.5px; font-weight: 500; line-height: 1.35; color: var(--ink); }
.activity-meta { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.4; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.activity-meta .dot { width: 2.5px; height: 2.5px; background: var(--muted-2); border-radius: 50%; }
.activity-time { font-family: var(--mono); font-size: 11px; color: var(--muted); text-align: right; padding-top: 2px; flex-shrink: 0; letter-spacing: -0.02em; }
.activity .chev { color: var(--muted-2); font-size: 16px; align-self: center; opacity: 0; transition: opacity 0.15s; }
.activity:hover .chev { opacity: 1; }
.tag-mini { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: var(--paper-2); color: var(--muted); border: 0.5px solid var(--line-soft); font-weight: 500; }
.tag-mini.booked { background: var(--olive-soft); color: #4d5a2a; border-color: transparent; }
.tag-mini.todo { background: var(--gold-soft); color: #8a6020; border-color: transparent; }
.tag-mini.wedding { background: var(--plum-soft); color: var(--plum); border-color: transparent; }

/* Day blocks (itinerary view) */
.day-block { margin-bottom: 16px; }
.day-header { display: flex; justify-content: space-between; align-items: baseline; padding: 0 20px 8px; }
.day-header.is-wedding { color: var(--plum); }
.day-date { font-family: var(--mono); font-size: 11px; letter-spacing: 0.04em; color: var(--muted); font-weight: 500; text-transform: uppercase; }
.day-title { font-family: var(--serif); font-size: 17px; font-weight: 500; letter-spacing: -0.01em; }
.day-pill { font-size: 9px; padding: 2px 7px; background: var(--plum-soft); color: var(--plum); border-radius: 999px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }

/* Place rows (stays) */
.place { display: flex; gap: 14px; align-items: flex-start; padding: 16px 20px; border-bottom: 0.5px solid var(--line-soft); }
.place-num { font-family: var(--serif); font-size: 22px; font-weight: 500; color: var(--rust); width: 32px; text-align: center; padding-top: 2px; letter-spacing: -0.02em; }
.place-main { flex: 1; }
.place-name { font-size: 15px; font-weight: 500; line-height: 1.3; }
.place-addr { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.4; }
.place-dates { font-family: var(--mono); font-size: 11px; color: var(--ink-2); margin-top: 6px; letter-spacing: -0.02em; }
.place-actions { display: flex; gap: 6px; margin-top: 10px; }
.btn-mini { padding: 5px 10px; font-size: 11px; background: var(--paper-2); border-radius: 999px; color: var(--ink-2); border: 0.5px solid var(--line); font-weight: 500; display: inline-flex; align-items: center; gap: 4px; }
.btn-mini:hover { background: var(--paper-3); }

/* Confirmations */
.conf { padding: 14px 20px; border-bottom: 0.5px solid var(--line-soft); }
.conf-h { display: flex; justify-content: space-between; align-items: baseline; gap: 10px; }
.conf-name { font-size: 14.5px; font-weight: 500; }
.conf-code { font-family: var(--mono); font-size: 11px; color: var(--rust-deep); background: rgba(184, 90, 62, 0.08); padding: 3px 8px; border-radius: 4px; letter-spacing: -0.02em; font-weight: 500; }
.conf-sub { font-size: 12px; color: var(--muted); margin-top: 4px; line-height: 1.4; }

/* Ticket card (expandable) */
.ticket { padding: 14px 20px; border-bottom: 0.5px solid var(--line-soft); cursor: pointer; }
.ticket:hover { background: var(--paper-2); }
.ticket-h { display: flex; align-items: center; gap: 12px; }
.ticket-icon { width: 38px; height: 38px; border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 17px; background: var(--paper-2); color: var(--ink-2); border: 0.5px solid var(--line-soft); position: relative; }
.ticket-icon-link { background: var(--teal); color: var(--paper); border-color: transparent; text-decoration: none; cursor: pointer; transition: all 0.15s; }
.ticket-icon-link:hover { background: var(--teal-deep); transform: scale(1.05); }
.ticket-icon-link:active { transform: scale(0.95); }
.ticket-icon-hint { position: absolute; bottom: -3px; right: -3px; background: var(--paper); color: var(--teal); border-radius: 50%; width: 14px !important; height: 14px !important; display: flex; align-items: center; justify-content: center; border: 1px solid var(--line-soft); padding: 1px; }
.ticket-main { flex: 1; min-width: 0; }
.ticket-name { font-size: 14.5px; font-weight: 500; line-height: 1.3; }
.ticket-meta { font-size: 12px; color: var(--muted); margin-top: 3px; line-height: 1.4; }
.ticket-right { text-align: right; flex-shrink: 0; }
.ticket-route { font-family: var(--mono); font-size: 11px; color: var(--rust-deep); background: rgba(160, 72, 50, 0.08); padding: 3px 8px; border-radius: 4px; letter-spacing: -0.02em; font-weight: 500; display: inline-block; }
.ticket-conf { font-family: var(--mono); font-size: 10px; color: var(--muted); margin-top: 6px; letter-spacing: -0.02em; }
.ticket-conf.missing { color: var(--gold); font-style: italic; }

/* Conf editor inline */
.conf-edit { margin-top: 10px; padding: 10px 12px; background: var(--paper-2); border-radius: var(--radius-sm); }
.conf-edit label { font-size: 11px; font-weight: 500; color: var(--ink-2); display: block; margin-bottom: 5px; }
.conf-edit input { width: 100%; padding: 7px 9px; font-family: var(--mono); font-size: 12px; border: 0.5px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); }
.conf-edit .help { font-size: 10px; color: var(--muted); margin-top: 4px; }

/* QR */
.qr-host { background: white; padding: 14px; border-radius: var(--radius-sm); display: flex; flex-direction: column; align-items: center; margin: 4px 0; box-shadow: var(--shadow); }
.qr-host img { display: block; max-width: 200px; height: auto; image-rendering: pixelated; }
.qr-host canvas { display: block; image-rendering: pixelated; }
.qr-label { font-family: var(--mono); font-size: 11px; color: #444; margin-top: 8px; letter-spacing: -0.02em; }
.qr-empty { font-size: 12px; color: var(--muted); padding: 30px 20px; text-align: center; background: var(--paper-2); border-radius: var(--radius-sm); }

/* Currency converter */
.cc-wrap { padding: 4px 0; }
.cc-row { display: flex; align-items: center; gap: 12px; background: var(--paper-2); border-radius: var(--radius-sm); padding: 12px 14px; margin: 8px 0; }
.cc-cur { font-family: var(--mono); font-size: 14px; font-weight: 600; color: var(--teal-deep); min-width: 44px; }
.cc-row input { flex: 1; border: none; background: transparent; font-size: 22px; font-family: var(--serif); color: var(--ink); text-align: right; outline: none; width: 100%; }
.cc-swap { display: flex; justify-content: center; margin: -2px 0; }
.cc-swap button { width: 36px; height: 36px; border-radius: 50%; background: var(--teal); color: var(--paper); font-size: 18px; display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow); }
.cc-rate { text-align: center; font-size: 12px; color: var(--muted); margin: 12px 0; }
.cc-presets { display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; }
.cc-presets button { padding: 7px 14px; border-radius: 999px; background: var(--paper-2); border: 0.5px solid var(--line); font-size: 13px; font-weight: 500; color: var(--ink-2); }
.cc-presets button:hover { background: var(--paper-3); }

/* Reserve button (inline link style) */
.reserve-btn { padding: 5px 10px; font-size: 11px; background: rgba(160, 72, 50, 0.1); border-radius: 999px; color: var(--rust-deep); border: 0.5px solid transparent; font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.reserve-btn .icon { width: 12px; height: 12px; }

/* Sub-tabs (Trip screen: Stays / Tickets) */
.subtab-bar { display: flex; gap: 8px; padding: 0 20px 8px; }
.subtab { flex: 1; padding: 9px; text-align: center; font-size: 13px; font-weight: 500; color: var(--muted); background: var(--paper-2); border-radius: var(--radius-sm); border: 0.5px solid var(--line-soft); }
.subtab.active { background: var(--ink); color: var(--paper); border-color: transparent; }

/* "Added by you" tag */
.tag-mini.mine { background: rgba(21, 85, 100, 0.12); color: var(--teal-deep); border-color: transparent; }

/* Add activity button (per day in itinerary) */
.add-activity-btn { display: inline-flex; align-items: center; gap: 6px; margin: 4px 20px 0; padding: 7px 14px; font-size: 12px; font-weight: 500; color: var(--teal-deep); background: rgba(21, 85, 100, 0.08); border-radius: 999px; }
.add-activity-btn:hover { background: rgba(21, 85, 100, 0.14); }
.add-activity-btn .icon { width: 14px; height: 14px; }

/* Form fields (add-activity modal) */
.form-field { margin-bottom: 14px; }
.form-field label { display: block; font-size: 12px; font-weight: 500; color: var(--ink-2); margin-bottom: 6px; }
.form-field label .opt { color: var(--muted); font-weight: 400; }
.form-field input, .form-field select { width: 100%; padding: 10px 12px; font-size: 15px; font-family: var(--sans); border: 0.5px solid var(--line); border-radius: var(--radius-sm); background: var(--paper); color: var(--ink); outline: none; }
.form-field input:focus, .form-field select:focus { border-color: var(--teal); }
.form-row { display: flex; gap: 10px; }
.form-row .form-field { flex: 1; }
.form-save { width: 100%; padding: 13px; margin-top: 6px; background: var(--teal); color: var(--paper); border-radius: var(--radius-sm); font-size: 15px; font-weight: 500; }
.form-save:hover { background: var(--teal-deep); }
.form-delete { width: 100%; padding: 12px; margin-top: 12px; background: rgba(160, 72, 50, 0.1); color: var(--rust-deep); border-radius: var(--radius-sm); font-size: 13px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 6px; }
.form-delete:hover { background: rgba(160, 72, 50, 0.18); }
.form-delete .icon { width: 14px; height: 14px; }

/* Ideas board */
.idea-add { display: flex; gap: 8px; padding: 0 20px 14px; }
.idea-add input { flex: 1; padding: 11px 14px; font-size: 15px; font-family: var(--sans); border: 0.5px solid var(--line); border-radius: var(--radius-sm); background: var(--paper); color: var(--ink); outline: none; }
.idea-add input:focus { border-color: var(--teal); }
.idea-add button { width: 46px; flex-shrink: 0; background: var(--teal); color: var(--paper); border-radius: var(--radius-sm); display: flex; align-items: center; justify-content: center; }
.idea-add button:hover { background: var(--teal-deep); }
.idea-add button .icon { width: 20px; height: 20px; }
.idea-list { padding: 0 20px; display: flex; flex-direction: column; gap: 10px; }
.idea-card { background: var(--paper-2); border-radius: var(--radius); padding: 14px 16px; border: 0.5px solid var(--line-soft); }
.idea-text { font-size: 15px; color: var(--ink); line-height: 1.4; }
.idea-actions { display: flex; gap: 8px; margin-top: 12px; }
.idea-actions button { display: inline-flex; align-items: center; gap: 5px; padding: 6px 12px; font-size: 12px; font-weight: 500; background: var(--paper); border: 0.5px solid var(--line); border-radius: 999px; color: var(--ink-2); }
.idea-actions button:hover { background: var(--paper-3); }
.idea-actions button .icon { width: 13px; height: 13px; }
.idea-actions .idea-del { margin-left: auto; color: var(--rust-deep); padding: 6px 10px; }
.idea-actions .idea-del .icon { width: 15px; height: 15px; }

/* Trip switcher */
.trip-list { padding: 0 20px; }
.trip-item { padding: 16px; margin-bottom: 10px; background: var(--paper-2); border-radius: var(--radius); cursor: pointer; border: 1px solid transparent; display: flex; justify-content: space-between; align-items: center; transition: all 0.15s; }
.trip-item:hover { background: var(--paper-3); }
.trip-item.active { background: var(--paper); border: 1.5px solid var(--teal); box-shadow: var(--shadow); }
.trip-item .trip-name { font-family: var(--serif); font-size: 17px; font-weight: 500; letter-spacing: -0.01em; }
.trip-item .trip-dates { font-size: 12px; color: var(--muted); margin-top: 3px; }
.trip-item .trip-status { font-size: 10px; padding: 3px 9px; border-radius: 999px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.08em; }
.status-active { background: var(--teal); color: var(--paper); }
.status-planning { background: var(--gold); color: var(--paper); }
.status-future { background: var(--paper-3); color: var(--muted); }

/* Tab bar */
.tab-bar { position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto; background: rgba(247, 243, 237, 0.92); backdrop-filter: saturate(180%) blur(20px); -webkit-backdrop-filter: saturate(180%) blur(20px); border-top: 0.5px solid var(--line); display: flex; padding-bottom: env(safe-area-inset-bottom); z-index: 50; }
.tab { flex: 1; padding: 11px 4px 14px; text-align: center; font-size: 10px; color: var(--muted); font-weight: 500; letter-spacing: 0.02em; }
.tab .icon { display: block; width: 20px; height: 20px; margin: 0 auto 4px; color: var(--muted); transition: color 0.15s; }
.tab.active { color: var(--ink); }
.tab.active .icon { color: var(--teal); }

/* Detail modal */
.modal-overlay { position: fixed; inset: 0; background: rgba(26, 42, 50, 0.5); z-index: 100; opacity: 0; pointer-events: none; transition: opacity 0.2s; backdrop-filter: blur(2px); }
.modal-overlay.open { opacity: 1; pointer-events: auto; }
.modal { position: fixed; left: 0; right: 0; bottom: 0; max-width: 480px; margin: 0 auto; background: var(--paper); border-radius: 20px 20px 0 0; z-index: 101; transform: translateY(100%); transition: transform 0.25s cubic-bezier(0.32, 0.72, 0, 1); max-height: 88vh; max-height: 88dvh; overflow-y: auto; padding-bottom: env(safe-area-inset-bottom); }
.modal.open { transform: translateY(0); }
.modal-handle { width: 36px; height: 4px; background: var(--line); border-radius: 2px; margin: 8px auto 6px; }
.modal-head { padding: 8px 22px 16px; border-bottom: 0.5px solid var(--line-soft); }
.modal-head .eyebrow { font-size: 10px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.modal-head .title { font-family: var(--serif); font-size: 24px; font-weight: 500; line-height: 1.15; letter-spacing: -0.01em; margin: 6px 0 6px; }
.modal-head .meta { font-size: 13px; color: var(--muted); }
.modal-body { padding: 18px 22px 28px; }

.planned-card { padding: 14px 16px; background: var(--ink); color: var(--paper); border-radius: var(--radius-sm); position: relative; overflow: hidden; }
.planned-card .lbl { font-size: 9px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; opacity: 0.65; }
.planned-card .name { font-family: var(--serif); font-size: 18px; line-height: 1.2; font-weight: 500; margin-top: 5px; letter-spacing: -0.01em; }
.planned-card .meta { font-size: 12px; opacity: 0.75; margin-top: 6px; line-height: 1.5; }
.planned-card .links { display: flex; gap: 6px; margin-top: 12px; flex-wrap: wrap; }
.planned-card .links a { padding: 5px 10px; font-size: 11px; background: rgba(255,255,255,0.12); border-radius: 999px; color: var(--paper); border: 0.5px solid rgba(255,255,255,0.2); font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.planned-card .links a:hover { background: rgba(255,255,255,0.2); }
.planned-card .links a .icon { width: 12px; height: 12px; }

.alt-card { background: var(--paper-2); border-radius: var(--radius-sm); padding: 14px; margin-top: 10px; border: 0.5px solid var(--line-soft); }
.alt-card.ai { background: var(--paper); border-left: 2px solid var(--plum); }
.alt-row { display: flex; gap: 12px; align-items: flex-start; }
.alt-icon { width: 32px; height: 32px; border-radius: 8px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; font-size: 15px; background: var(--paper); color: var(--ink-2); border: 0.5px solid var(--line); }
.alt-card.ai .alt-icon { background: var(--plum-soft); color: var(--plum); border-color: transparent; }
.alt-main { flex: 1; min-width: 0; }
.alt-name { font-size: 14px; font-weight: 500; line-height: 1.3; display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
.alt-desc { font-size: 12px; color: var(--ink-2); margin-top: 5px; line-height: 1.5; }
.alt-tags { display: flex; gap: 5px; margin-top: 8px; flex-wrap: wrap; }
.alt-tags .tag-mini { font-size: 9px; }
.alt-actions { display: flex; gap: 6px; margin-top: 10px; flex-wrap: wrap; }
.alt-actions button, .alt-actions a { padding: 5px 10px; font-size: 11px; background: var(--paper); border-radius: 999px; color: var(--ink-2); border: 0.5px solid var(--line); font-weight: 500; text-decoration: none; display: inline-flex; align-items: center; gap: 4px; }
.alt-actions a:hover { background: var(--paper-3); }
.alt-actions .swap { background: var(--teal); color: var(--paper); border-color: transparent; }
.alt-actions a .icon { width: 12px; height: 12px; }
.ai-pill { font-size: 9px; padding: 1px 6px; background: var(--plum-soft); color: var(--plum); border-radius: 4px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.05em; display: inline-flex; align-items: center; gap: 3px; }

.ai-button { display: block; width: 100%; padding: 14px; margin-top: 16px; background: var(--paper); border: 1.5px dashed var(--plum); border-radius: var(--radius-sm); color: var(--plum); font-size: 13px; font-weight: 500; cursor: pointer; text-align: center; }
.ai-button:hover { background: var(--plum-soft); }
.ai-button .icon { display: block; width: 22px; height: 22px; margin: 0 auto 4px; }
.ai-button .sub { font-size: 11px; color: var(--muted); font-weight: 400; margin-top: 2px; }

.ai-banner { display: flex; align-items: center; gap: 10px; padding: 10px 12px; background: var(--plum-soft); border-radius: var(--radius-sm); margin-top: 16px; font-size: 12px; color: var(--plum); }
.ai-banner .icon { width: 14px; height: 14px; }
.ai-banner .txt { flex: 1; }
.ai-banner button { padding: 4px 8px; font-size: 10px; background: var(--paper); border-radius: 999px; border: 0.5px solid var(--plum); color: var(--plum); font-weight: 500; }

.spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--plum-soft); border-top-color: var(--plum); border-radius: 50%; animation: spin 0.6s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }

/* API key panel */
.key-panel { padding: 14px; background: var(--paper-2); border-radius: var(--radius-sm); margin-bottom: 16px; font-size: 12px; }
.key-panel .lbl { font-weight: 500; color: var(--ink); display: block; margin-bottom: 6px; }
.key-panel input { width: 100%; padding: 8px 10px; font-family: var(--mono); font-size: 11px; border: 0.5px solid var(--line); border-radius: 6px; background: var(--paper); color: var(--ink); }
.key-panel .note { color: var(--muted); margin-top: 6px; font-size: 11px; }
.key-panel .actions { display: flex; gap: 6px; margin-top: 8px; }
.key-panel button { padding: 6px 10px; font-size: 11px; border-radius: 999px; background: var(--ink); color: var(--paper); font-weight: 500; }
.key-panel button.outline { background: var(--paper); color: var(--ink-2); border: 0.5px solid var(--line); }

/* Settings page */
.settings-row { padding: 16px 20px; border-bottom: 0.5px solid var(--line-soft); display: flex; justify-content: space-between; align-items: center; cursor: pointer; }
.settings-row:hover { background: var(--paper-2); }
.settings-name { font-size: 14px; font-weight: 500; }
.settings-sub { font-size: 12px; color: var(--muted); margin-top: 2px; }
.settings-val { font-size: 12px; color: var(--muted); font-family: var(--mono); }

/* Decorative dot pattern in hero areas */
.dots { position: absolute; opacity: 0.5; pointer-events: none; }

/* Hide tab bar on modal open optional */
.app.modal-open .tab-bar { transform: translateY(110%); transition: transform 0.25s; }

/* Section title for screens */
.screen-title { font-family: var(--serif); font-size: 28px; font-weight: 500; letter-spacing: -0.02em; padding: 0 20px; margin: 0 0 14px; line-height: 1.05; font-variation-settings: 'opsz' 144; }
.screen-sub { padding: 0 20px; color: var(--muted); font-size: 13px; margin: -10px 0 18px; }

/* Empty/coming soon states */
.empty { text-align: center; padding: 60px 20px; color: var(--muted); }
.empty .icon { width: 36px; height: 36px; opacity: 0.4; margin: 0 auto 10px; display: block; }
.empty .t { font-family: var(--serif); font-size: 18px; color: var(--ink-2); margin-bottom: 6px; }
.empty .s { font-size: 13px; }

/* SVG icon base — sized to match the surrounding font-size */
.icon { width: 1em; height: 1em; flex-shrink: 0; display: inline-block; vertical-align: -0.15em; }

/* Audience badges */
.aud-badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; padding: 4px 10px; border-radius: 999px; }
.aud-badge .icon { width: 12px; height: 12px; }
.aud-family { background: rgba(90, 106, 50, 0.15); color: #e8efd4; }
.aud-teens  { background: rgba(198, 149, 64, 0.18); color: #f0e5cc; }
.aud-adults { background: rgba(90, 58, 96, 0.25); color: #ebdfee; }
/* On light activity rows (not the dark planned-card), use darker text */
.activity-meta .aud-badge.aud-family, .alt-tags .aud-badge.aud-family { background: var(--olive-soft); color: #4d5a2a; }
.activity-meta .aud-badge.aud-teens, .alt-tags .aud-badge.aud-teens { background: var(--gold-soft); color: #8a6020; }
.activity-meta .aud-badge.aud-adults, .alt-tags .aud-badge.aud-adults { background: var(--plum-soft); color: var(--plum); }
</style>

function inferIcon(activity) {
  if (activity.icon && (SVG_ICONS[activity.icon] || ICON_MAP[activity.icon])) return activity.icon;
  const text = ((activity.title || '') + ' ' + (activity.meta || '')).toLowerCase();
  for (const [key, re] of ICON_PATTERNS) {
    if (re.test(text)) return key;
  }
  return activity.icon || 'star';
}

function iconHtml(key) {
  const resolved = SVG_ICONS[key] ? key : (ICON_MAP[key] && SVG_ICONS[ICON_MAP[key]] ? ICON_MAP[key] : 'circle');
  const paths = SVG_ICONS[resolved] || SVG_ICONS.circle;
  return `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${paths}</svg>`;
}

/* ===========================================
   AUDIENCE BADGES — who an activity is suitable for.
   Values: 'family' (all ages), 'adults' (18+ / 16+ restrictions),
           'teens' (older kids OK, not little ones).
   =========================================== */
const AUDIENCE = {
  family: { label: 'Family friendly', cls: 'aud-family', icon: 'home' },
  teens:  { label: 'Teens & up',      cls: 'aud-teens',  icon: 'star' },
  adults: { label: 'Adults only',     cls: 'aud-adults', icon: 'glass-cocktail' },
};
function renderAudienceBadge(key) {
  const a = AUDIENCE[key];
  if (!a) return '';
  return `<span class="aud-badge ${a.cls}">${iconHtml(a.icon)} ${a.label}</span>`;
}

   Note: mailto: doesn't natively support search. Best we can do is
   pre-fill subject/body the user can paste into search, plus offer
   Gmail web search as a fallback.
   =========================================== */
function buildEmailSearchUrl(query) {
  // Gmail web search works reliably and opens the Gmail app if installed
  return `https://mail.google.com/mail/u/0/#search/${encodeURIComponent(query)}`;
}

function buildLinkButtons(links, opts = {}) {
  if (!links || !links.length) return '';
  const dark = opts.dark; // dark background = use light button styles
  const cls = dark ? '' : '';
  return links.map(l => {
    if (l.type === 'map') {
      const q = encodeURIComponent(l.query || '');
      // Apple Maps on iOS, Google on everything else
      return `<a class="${cls}" href="https://maps.apple.com/?q=${q}" target="_blank" rel="noopener"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="11" r="3"/><path d="M17.657 16.657l-4.243 4.243a2 2 0 0 1 -2.827 0l-4.244 -4.243a8 8 0 1 1 11.314 0z"/></svg> ${l.label || 'Map'}</a>`;
    }
    if (l.type === 'url') {
      const icon = l.icon || 'external-link';
      return `<a class="${cls}" href="${l.url}" target="_blank" rel="noopener">${iconHtml(icon)} ${l.label || 'Open'}</a>`;
    }
    if (l.type === 'search') {
      const def = SEARCH_BASES[l.on || 'google'] || SEARCH_BASES.google;
      const q = encodeURIComponent((l.query || '') + (def.suffix || ''));
      return `<a class="${cls}" href="${def.base}${q}" target="_blank" rel="noopener">${iconHtml(def.icon)} ${l.label || def.label}</a>`;
    }
    if (l.type === 'reserve') {
      return buildReserveButton(l).replace('reserve-btn', `reserve-btn ${cls}`);
    }
    return '';
  }).join('');
}

   Platforms: 'opentable', 'google' (Reserve with Google / search),
   'resy', or a direct 'url'. All use universal links so they open the
   native app on a phone when installed, else the mobile site.
   =========================================== */
function reserveUrlFor(r) {
  const q = encodeURIComponent(r.name || r.query || '');
  switch (r.platform) {
    case 'opentable': return r.url || `https://www.opentable.com/s?term=${q}`;
    case 'resy':      return r.url || `https://resy.com/cities/search?query=${q}`;
    case 'url':       return r.url;
    case 'google':
    default:          return r.url || `https://www.google.com/search?q=${q}%20reservation`;
  }
}
function reserveLabelFor(r) {
  return { opentable: 'OpenTable', resy: 'Resy', google: 'Google', url: 'the restaurant site' }[r.platform] || 'Google';
}

function buildReserveButton(r) {
  let url;
  const q = encodeURIComponent(r.name || r.query || '');
  switch (r.platform) {
    case 'opentable':
      url = r.url || `https://www.opentable.com/s?term=${q}`;
      break;
    case 'resy':
      url = r.url || `https://resy.com/cities/search?query=${q}`;
      break;
    case 'url':
      url = r.url;
      break;
    case 'google':
    default:
      // Google search with "reservation" opens Reserve-with-Google / Maps booking on phones
      url = r.url || `https://www.google.com/search?q=${q}%20reservation`;

  return `<a class="reserve-btn" href="${url}" target="_blank" rel="noopener">${iconHtml('tools-kitchen-2')} Reserve a table</a>`;
}

  currentScreen: 'home',

  // when the screen loads, but the user can step backward/forward through the trip.
  viewingDate: null,
  // dateOverride lets us pretend "today" is some other date (for debug/testing). null = use real today.
  dateOverride: null,
  // which subtab is active on the merged Trip screen
  tripSubtab: 'stays',
};

/* Return today's date as YYYY-MM-DD, honoring any debug override. */
function realToday() {
  if (state.dateOverride) return state.dateOverride;
  const d = new Date();
  const y = d.getFullYear();
  const m = String(d.getMonth() + 1).padStart(2, '0');
  const day = String(d.getDate()).padStart(2, '0');
  return `${y}-${m}-${day}`;
}

/* Day-level country context for currency/timezone stats.
   Inferred from the day's location string. Returns { currency, tzLabel }
   where tzLabel is "+Xh" / "-Xh" / "0" relative to America/Chicago (Austin).
   For transit days like "Austin → Miami", we treat the destination as the
   relevant context since travelers spend most of the active hours there. */
function dayContext(day) {
  if (!day) return { currency: '—', tzLabel: '—' };
  // Use the destination (after →) when present, else the whole string
  const raw = (day.location || '').toLowerCase();
  const loc = raw.includes('→') ? raw.split('→').pop().trim() : raw;
  // Order: most specific destinations first
  if (loc.includes('split') || loc.includes('hvar') || loc.includes('croatia')) return { currency: 'EUR', tzLabel: '+7h' };
  if (loc.includes('london') || loc.includes('heathrow')) return { currency: 'GBP', tzLabel: '+6h' };
  if (loc.includes('miami')) return { currency: 'USD', tzLabel: '+1h' };
  if (loc.includes('austin')) return { currency: 'USD', tzLabel: '0' };
  return { currency: '—', tzLabel: '—' };
}

/* Merge built-in + manual activities for a given day, sorted by time. */
function activitiesForDay(day) {
  const manual = getManualActivities().filter(a => a.date === day.date);
  const all = [...day.activities, ...manual];
  return all.slice().sort((a, b) => timeRank(a.time) - timeRank(b.time));
}

/* Convert a time label to a sortable number. Handles "9:00 am", "Evening", etc. */
function timeRank(t) {
  if (!t) return 9999;
  const s = String(t).toLowerCase().trim();
  const named = { dawn: 600, 'early': 630, morning: 800, 'late morning': 1030, midday: 1200, noon: 1200, afternoon: 1400, evening: 1900, sunset: 1930, night: 2100, 'all day': 1 };
  for (const [k, v] of Object.entries(named)) if (s.includes(k)) return v;
  const m = s.match(/(\d{1,2})(?::(\d{2}))?\s*(am|pm)?/);
  if (m) {
    let h = parseInt(m[1], 10);
    const min = m[2] ? parseInt(m[2], 10) : 0;
    if (m[3] === 'pm' && h < 12) h += 12;
    if (m[3] === 'am' && h === 12) h = 0;
    return h * 100 + min;
  }
  return 5000;
}

function updateHeaders() {
  const t = trip();
  ['hdr-badge','hdr-badge-2','hdr-badge-3','hdr-badge-5'].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = t.badge; });
  ['hdr-trip','hdr-trip-2','hdr-trip-3','hdr-trip-5'].forEach(id => { const el = document.getElementById(id); if (el) el.textContent = t.fullName; });
}

function renderHome() {
  const t = trip();
  updateHeaders();

  // Planning-stage trips don't have days yet — show a placeholder and bail
  if (t.status === 'planning' || !t.days || !t.days.length) {
    document.getElementById('home-title').textContent = t.name;
    document.getElementById('home-sub').textContent = 'Planning stage';
    document.getElementById('up-next-host').innerHTML = `<div style="margin: 0 20px;"><div class="empty" style="background: var(--paper-2); border-radius: var(--radius); padding: 30px 20px;"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="9"/><path d="M8 16l2 -6l6 -2l-2 6z"/></svg><div class="t">No itinerary yet</div><div class="s">Start a chat to plan this trip and the days will appear here.</div></div></div>`;
    document.getElementById('today-host').innerHTML = '';
    // Hide day nav for planning trips
    document.getElementById('day-prev').hidden = true;
    document.getElementById('day-next').hidden = true;
    document.getElementById('day-today-link').hidden = true;
    document.getElementById('stat-progress').textContent = '—';
    document.getElementById('stat-progress-lbl').textContent = 'Progress';
    document.getElementById('stat-currency').textContent = '—';
    document.getElementById('stat-tz').textContent = '—';
    return;
  }

  document.getElementById('day-prev').hidden = false;
  document.getElementById('day-next').hidden = false;

  const days = t.days;
  const today = realToday();
  const todayIdx = days.findIndex(d => d.date === today);

  // Determine which day to view.
  // First load: default to today if in-trip, else day 0.
  if (state.viewingDate == null) {
    state.viewingDate = (todayIdx >= 0) ? today : days[0].date;
  }
  // Clamp to valid trip range
  let viewIdx = days.findIndex(d => d.date === state.viewingDate);
  if (viewIdx < 0) {
    viewIdx = 0;
    state.viewingDate = days[0].date;
  }

  const day = days[viewIdx];
  const isToday = day.date === today;
  const isBeforeTrip = new Date(today) < new Date(days[0].date);
  const isAfterTrip = new Date(today) > new Date(days[days.length - 1].date);

  // Title + subtitle
  let titleHtml = day.title;
  let subParts = [day.dayLabel, day.location];
  if (isToday) {
    titleHtml = day.title;
    subParts = [`Today · ${day.dayLabel}`, day.location];
  } else if (!isBeforeTrip && !isAfterTrip) {
    // In-trip but viewing another day
    const offset = viewIdx - todayIdx;
    if (offset === 1) subParts = [`Tomorrow · ${day.dayLabel}`, day.location];
    else if (offset === -1) subParts = [`Yesterday · ${day.dayLabel}`, day.location];
    else if (offset > 1) subParts = [`In ${offset} days · ${day.dayLabel}`, day.location];
    else if (offset < -1) subParts = [`${Math.abs(offset)} days ago · ${day.dayLabel}`, day.location];
  }
  document.getElementById('home-title').textContent = titleHtml;
  document.getElementById('home-sub').textContent = subParts.filter(Boolean).join(' · ');

  // Prev/Next button enabled state
  document.getElementById('day-prev').disabled = viewIdx === 0;
  document.getElementById('day-next').disabled = viewIdx === days.length - 1;

  // "Back to today" link visible only when viewing a different day AND today is in the trip range
  const showBackToToday = (todayIdx >= 0 && viewIdx !== todayIdx);
  document.getElementById('day-today-link').hidden = !showBackToToday;

  // Up-next label and content depend on whether we're viewing today
  const upNextLabel = document.getElementById('up-next-label');
  const todayPlanLabel = document.getElementById('today-plan-label');
  if (isToday) {
    upNextLabel.textContent = 'Up next';
    todayPlanLabel.textContent = "Today's plan";
  } else if (viewIdx > todayIdx && todayIdx >= 0) {
    upNextLabel.textContent = 'First up';
    todayPlanLabel.textContent = 'Plan for this day';
  } else if (viewIdx < todayIdx) {
    upNextLabel.textContent = 'Started with';
    todayPlanLabel.textContent = 'That day';
  } else {
    upNextLabel.textContent = 'First up';
    todayPlanLabel.textContent = 'Plan for this day';
  }

  // Hero "up next" card
  // - If viewing today: show tomorrow's first activity
  // - If viewing a future day: show the first activity of THAT day
  // - If viewing past day: show first activity of that day
  let heroDay = null, heroItem = null;
  if (isToday) {
    if (viewIdx + 1 < days.length) {
      heroDay = days[viewIdx + 1];
      heroItem = heroDay.activities.find(a => a.booked) || heroDay.activities[0];
    }
  } else {
    heroDay = day;
    heroItem = day.activities[0];
  }
  const hero = document.getElementById('up-next-host');
  if (heroItem && heroDay) {
    hero.innerHTML = `
      <div class="hero-card">
        <div class="eyebrow">${heroDay.dayLabel} · ${heroItem.time}</div>
        <div class="what">${heroItem.title}</div>
        <div class="when">${heroItem.meta || ''}</div>
        <div class="actions">
          <button onclick="show('itinerary')"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="6" cy="19" r="2"/><circle cx="18" cy="5" r="2"/><path d="M12 19h4.5a3.5 3.5 0 0 0 0 -7h-8a3.5 3.5 0 0 1 0 -7h3.5"/></svg> See full plan</button>
        </div>
      </div>`;
  } else {
    hero.innerHTML = `<div style="margin: 0 20px;"><div style="padding: 20px; background: var(--paper-2); border-radius: var(--radius); text-align: center; color: var(--muted); font-size: 13px;">Nothing scheduled next</div></div>`;
  }

  // Today's / viewing day's plan (filter out the activity already shown in hero, but only if isToday and hero is tomorrow)
  const planHost = document.getElementById('today-host');
  planHost.innerHTML = activitiesForDay(day).map(a => renderActivity(a, day)).join('');

  // Stats — Progress
  const progEl = document.getElementById('stat-progress');
  const progLblEl = document.getElementById('stat-progress-lbl');
  if (isBeforeTrip) {
    const daysUntil = Math.round((new Date(days[0].date) - new Date(today)) / 86400000);
    progEl.textContent = daysUntil + '';
    progLblEl.textContent = daysUntil === 1 ? 'Day to go' : 'Days to go';
  } else if (isAfterTrip) {
    progEl.textContent = '✓';
    progLblEl.textContent = 'Trip done';
  } else {
    progEl.textContent = `${todayIdx + 1}/${days.length}`;
    progLblEl.textContent = 'Day of trip';
  }

  // Stats — Currency & timezone (based on the day BEING VIEWED, not today)
  const ctx = dayContext(day);
  document.getElementById('stat-currency').textContent = ctx.currency;
  document.getElementById('stat-tz').textContent = ctx.tzLabel;
}

function navDay(delta) {
  const t = trip();
  if (!t.days || !t.days.length) return;
  let idx = t.days.findIndex(d => d.date === state.viewingDate);
  if (idx < 0) idx = 0;
  const newIdx = Math.max(0, Math.min(t.days.length - 1, idx + delta));
  state.viewingDate = t.days[newIdx].date;
  renderHome();
}

function goToToday() {
  const t = trip();
  const today = realToday();
  const idx = t.days.findIndex(d => d.date === today);
  state.viewingDate = (idx >= 0) ? today : t.days[0].date;
  renderHome();
}

function renderActivity(a, day) {
  const colorClass = a.color ? `activity-icon ${a.color}` : 'activity-icon';
  const tags = [];
  if (a.booked) tags.push('<span class="tag-mini booked">Booked</span>');
  else if ((a.meta || '').toLowerCase().includes('to book')) tags.push('<span class="tag-mini todo">To book</span>');
  if (a.wedding) tags.push('<span class="tag-mini wedding">Wedding</span>');
  // Surface restrictive audiences on the row (family-friendly is the default, no need to badge it)
  if (a.audience === 'adults') tags.push(renderAudienceBadge('adults'));
  else if (a.audience === 'teens') tags.push(renderAudienceBadge('teens'));
  if (a.manual) tags.push('<span class="tag-mini mine">Added by you</span>');

  const tappable = !!a.id;
  const clickAttr = tappable ? `onclick="openActivityDetail('${a.id}')"` : '';

  return `
    <div class="activity" ${clickAttr}>
      <div class="${colorClass}">${iconHtml(inferIcon(a))}</div>
      <div class="activity-main">
        <div class="activity-title">${a.title}</div>
        <div class="activity-meta">
          ${a.meta ? `<span>${a.meta}</span>` : ''}
          ${tags.length ? `<span class="dot"></span>${tags.join('')}` : ''}
        </div>
      </div>
      <div class="activity-time">${a.time || ''}</div>
      ${tappable ? '<svg class="icon chev" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 6l6 6l-6 6"/></svg>' : ''}
    </div>`;
}

  const host = document.getElementById('itin-host');

    </div>

function renderTrip() {
  updateHeaders();
  renderStays();
  renderTickets();
  // Restore last-used subtab (default stays)
  setTripSubtab(state.tripSubtab || 'stays');

function setTripSubtab(which) {
  state.tripSubtab = which;
  document.querySelectorAll('.subtab').forEach(b => b.classList.toggle('active', b.dataset.subtab === which));
  document.getElementById('trip-stays-host').hidden = which !== 'stays';
  document.getElementById('trip-tickets-host').hidden = which !== 'tickets';

function renderStays() {
  const t = trip();
  const lodgingCount = t.lodging?.length || 0;
  const venueCount = t.venues?.length || 0;
  const host = document.getElementById('trip-stays-host');
  if (!lodgingCount && !venueCount) {
    host.innerHTML = `<div class="empty"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M14 10m-4 0a4 4 0 1 0 8 0a4 4 0 1 0 -8 0"/><path d="M14 10l-7 7l3 3l4 -4"/><path d="M14 13l3 3"/></svg><div class="t">No stays yet</div><div class="s">Hotels and rentals will show here once booked.</div></div>`;
    return;
  }

  let html = '';
  if (lodgingCount) {
    html += `<div class="section-label" style="padding-top: 8px;"><span class="label">Lodging</span><span class="line"></span></div>`;
    html += t.lodging.map((l, i) => renderPlace(l, i + 1, 'rust')).join('');
  }
  if (venueCount) {
    html += `<div class="section-label" style="padding-top: 18px;"><span class="label">Wedding venues</span><span class="line"></span></div>`;
    html += t.venues.map((v, i) => renderPlace(v, i + 1, 'plum')).join('');
  }
  host.innerHTML = html;
}

function renderPlace(l, num, color) {
  const numColor = color === 'plum' ? 'var(--plum)' : 'var(--rust)';
  return `

function renderTickets() {

function renderTicketCard(it, section) {
  const t = trip();
  const carrier = CARRIERS[it.carrier];

  const iconName = carrier?.logo || (section === 'Flights' ? 'plane' : section === 'Hotels' ? 'bed' : section === 'Ferries' ? 'ship' : 'ticket');
  const confClass = conf ? '' : 'missing';

  const directUrl = carrier ? carrier.manageUrl(conf) : null;
  const iconMarkup = directUrl
    ? `<a class="ticket-icon ticket-icon-link" href="${directUrl}" target="_blank" rel="noopener" onclick="event.stopPropagation()" title="Open in ${carrier.appName}">${iconHtml(iconName)}<svg class="icon ticket-icon-hint" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 6h-6a2 2 0 0 0 -2 2v10a2 2 0 0 0 2 2h10a2 2 0 0 0 2 -2v-6"/><path d="M11 13l9 -9"/><path d="M15 4h5v5"/></svg></a>`
    : `<div class="ticket-icon">${iconHtml(iconName)}</div>`;
  return `
    <div class="ticket" onclick="openTicketDetail('${it.confKey}')">
      <div class="ticket-h">
        ${iconMarkup}
        <div class="ticket-main">
          <div class="ticket-name">${it.name}</div>

      </div>
    </div>
  `;
}

function findTicket(confKey) {
  const t = trip();
  for (const [section, items] of Object.entries(t.tickets)) {
    for (const it of items) {
      if (it.confKey === confKey) return { ticket: it, section };
    }
  }
  return null;
}

/* ===========================================
   API KEY MANAGEMENT
   =========================================== */
function getApiKey() {
  try { return localStorage.getItem('atlas-anthropic-key') || ''; } catch (e) { return ''; }
}
function setApiKey(k) {
  try {
    if (k) localStorage.setItem('atlas-anthropic-key', k);
    else localStorage.removeItem('atlas-anthropic-key');
  } catch (e) {}
}
function showApiKeyPanel() {
  const host = document.getElementById('settings-panel-host');
  if (!host) return;
  host.innerHTML = `
    <div class="key-panel">
      <label class="lbl">Anthropic API key</label>
      <input id="key-input" type="password" placeholder="sk-ant-..." value="${getApiKey()}">
      <div class="note">Get one at console.anthropic.com. Stored only in this browser, never sent anywhere except Anthropic's API.</div>
      <div class="actions">
        <button onclick="saveApiKey()">Save</button>
        <button class="outline" onclick="clearApiKey()">Remove</button>
      </div>
    </div>`;
  document.getElementById('key-input').focus();
}
function saveApiKey() {
  const v = document.getElementById('key-input').value.trim();
  setApiKey(v);
  renderSettings();
}
function clearApiKey() {
  setApiKey('');
  renderSettings();
}

function findActivity(id) {
  const t = trip();
  for (const d of t.days) {
    for (const a of d.activities) {
      if (a.id === id) return { activity: a, day: d };
    }
  }
  // Check manual activities
  const manual = getManualActivities().find(a => a.id === id);
  if (manual) {
    const day = t.days.find(d => d.date === manual.date);
    if (day) return { activity: manual, day };
  }
  return null;
}

function openActivityDetail(id) {
  const found = findActivity(id);
  if (!found) return;
  const { activity, day } = found;

  document.getElementById('app').classList.add('modal-open');

  // "Locked" = nothing to swap: confirmed bookings, ticketed/wedding events.
  const isLocked = activity.booked || activity.wedding || activity.locked;
  const curated = activity.alternates || [];

  const subtitle = curated.length
    ? 'Tap an alternate to see options'

  document.getElementById('modal-head').innerHTML = `
    <div class="eyebrow">${day.dayLabel} · ${activity.time}</div>
    <div class="title">${activity.title}</div>

  let body = `
    <div class="planned-card">
      <div class="lbl">Currently planned</div>
      <div class="name">${activity.title}</div>

      ${audienceBadge ? `<div style="margin-top: 10px;">${audienceBadge}</div>` : ''}

      <a href="${reserveUrlFor(activity.reserve)}" target="_blank" rel="noopener" class="ai-button" style="border: 1.5px solid var(--rust); color: var(--rust); display: block; text-align: center; text-decoration: none; margin-top: 14px;">
        ${iconHtml('tools-kitchen-2')}

  }

  if (curated.length) {
    body += `<div style="margin-top: 18px; font-size: 11px; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted);">Curated alternates</div>`;

const openAlternates = openActivityDetail;

async function generateAlternates(id) {
  const key = getApiKey();
  if (!key) {
    show('settings');
    closeModal();
    setTimeout(showApiKeyPanel, 200);
    return;
  }

  const host = document.getElementById('ai-results-host');
  host.innerHTML = `
    <div class="ai-banner" style="margin-top: 16px;">
      <span class="spinner"></span>
      <span class="txt">Thinking — considering location, time of day, and what you've done...</span>
    </div>`;

  const found = findActivity(id);
  if (!found) return;
  const { activity, day } = found;
  const t = trip();

  const prompt = `You are helping a family of 4 (Luke, Christy, Ian age 13, Aspen age 10) on a trip to ${t.fullName}.

They have this activity planned on ${day.dayLabel}:
- Title: ${activity.title}
- When: ${activity.time}
- Details: ${activity.meta || 'n/a'}
- Location: ${day.location}

They want fresh alternative ideas in case they decide to audible. Suggest exactly 3 alternatives that:
- Are realistic for that exact day, location, and time slot
- Vary in energy level (one low-effort option, one more active)
- Are NOT activities already in their plan
- Are kid-friendly given Ian and Aspen's ages

Respond with ONLY a JSON array of objects, no other text or markdown fences. Each object has these fields:
  - name: short title (3-7 words)
  - desc: 1-2 sentence pitch
  - tags: array of 2-3 short tag words (examples: "Kids", "Cultural", "Low effort", "Active", "Water", "Indoors")
  - links: array of 1-3 link objects. Each link is ONE of these exact shapes:
      { "type": "map", "query": "Place Name City" }
      { "type": "search", "query": "what to search", "on": "google" }   // for info pages
      { "type": "search", "query": "what to search", "on": "viator" }   // for bookable tours
      { "type": "search", "query": "what to search", "on": "getyourguide" } // for bookable tours
      { "type": "search", "query": "what to search", "on": "tripadvisor" } // for restaurants
      { "type": "search", "query": "what to search", "on": "opentable" }   // for restaurants
  Always include at least one "map" link with a precise place query. Use search links to point at booking/info; NEVER invent direct URLs.`;

  try {
    const response = await fetch('https://api.anthropic.com/v1/messages', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/json',
        'x-api-key': key,
        'anthropic-version': '2023-06-01',
        'anthropic-dangerous-direct-browser-access': 'true',
      },
      body: JSON.stringify({
        model: 'claude-sonnet-4-20250514',
        max_tokens: 1000,
        messages: [{ role: 'user', content: prompt }],
      }),
    });
    if (!response.ok) {
      const err = await response.text();
      throw new Error(err.slice(0, 200));
    }
    const data = await response.json();
    let text = data.content?.[0]?.text || '';
    text = text.replace(/```json|```/g, '').trim();
    const rawAlts = JSON.parse(text);

    // Safety: strip any unsafe link types (the AI is instructed to only use map/search,
    // but if it ever returns type: 'url' we drop it to prevent fake/hallucinated URLs)
    const SAFE_TYPES = new Set(['map', 'search']);
    const SAFE_SEARCH_ENGINES = new Set(['google', 'viator', 'getyourguide', 'tripadvisor', 'opentable']);
    const alts = rawAlts.map(a => ({
      ...a,
      links: (a.links || []).filter(l => {
        if (!l || !SAFE_TYPES.has(l.type)) return false;
        if (l.type === 'search' && !SAFE_SEARCH_ENGINES.has(l.on)) return false;
        return true;
      }),
    }));

    host.innerHTML = `
      <div class="ai-banner" style="margin-top: 16px;">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.5 4.5l4.5 1.5l-4.5 1.5l-1.5 4.5l-1.5 -4.5l-4.5 -1.5l4.5 -1.5z"/><path d="M19 15l.6 1.8l1.8 .6l-1.8 .6l-.6 1.8l-.6 -1.8l-1.8 -.6l1.8 -.6z"/></svg>
        <span class="txt">Fresh ideas for ${day.dayLabel}</span>
        <button onclick="generateAlternates('${id}')">Refresh</button>
      </div>
      ${alts.map(alt => renderAlt(alt, true)).join('')}
    `;
  } catch (e) {
    host.innerHTML = `
      <div class="ai-banner" style="margin-top: 16px; background: rgba(184, 90, 62, 0.1); color: var(--rust-deep);">
        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 9v4"/><path d="M10.363 3.591l-8.106 13.534a1.914 1.914 0 0 0 1.636 2.871h16.214a1.914 1.914 0 0 0 1.636 -2.871l-8.106 -13.534a1.914 1.914 0 0 0 -3.274 0z"/><path d="M12 16h.01"/></svg>
        <span class="txt">Couldn't reach Claude: ${e.message || e}</span>
      </div>`;
  }
}

/* ===========================================
   CURRENCY CONVERTER
   Live rates via frankfurter.app (no key, ECB data). Falls back to
   baked-in approximate rates if offline. Base reference is USD.
   =========================================== */
// Approximate fallback rates (per 1 USD) — only used if the live fetch fails offline.
const FALLBACK_RATES = { USD: 1, EUR: 0.92, GBP: 0.79, HRK: 6.95 };
let cachedRates = null;

async function fetchRates() {
  if (cachedRates) return cachedRates;
  try {
    // frankfurter.app: free, no API key, returns rates relative to a base
    const res = await fetch('https://api.frankfurter.app/latest?from=USD&to=EUR,GBP');
    if (!res.ok) throw new Error('rate fetch failed');
    const data = await res.json();
    cachedRates = { USD: 1, EUR: data.rates.EUR, GBP: data.rates.GBP, _live: true, _date: data.date };
    return cachedRates;
  } catch (e) {
    cachedRates = { ...FALLBACK_RATES, _live: false };
    return cachedRates;
  }
}

function openCurrencyConverter() {
  const t = trip();
  // Determine the "local" currency from the day being viewed
  const days = t.days || [];
  let viewIdx = days.findIndex(d => d.date === state.viewingDate);
  if (viewIdx < 0) viewIdx = 0;
  const localCurrency = days.length ? dayContext(days[viewIdx]).currency : 'EUR';
  const local = ['EUR', 'GBP', 'USD'].includes(localCurrency) ? localCurrency : 'EUR';
  const home = 'USD'; // Austin home currency

  document.getElementById('app').classList.add('modal-open');
  document.getElementById('modal-head').innerHTML = `
    <div class="eyebrow">Quick tool</div>
    <div class="title">Currency converter</div>
    <div class="meta">Home (USD) ⇄ local (${local})</div>
  `;
  document.getElementById('modal-body').innerHTML = `
    <div class="cc-wrap">
      <div class="cc-row">
        <label class="cc-cur" id="cc-label-a">${home}</label>
        <input id="cc-input-a" type="number" inputmode="decimal" value="100" oninput="ccConvert('a')">
      </div>
      <div class="cc-swap"><button onclick="ccSwap()">⇅</button></div>
      <div class="cc-row">
        <label class="cc-cur" id="cc-label-b">${local}</label>
        <input id="cc-input-b" type="number" inputmode="decimal" value="" oninput="ccConvert('b')">
      </div>
      <div class="cc-rate" id="cc-rate">Loading live rate…</div>
      <div class="cc-presets" id="cc-presets"></div>
    </div>
  `;
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('modal').classList.add('open');

  // Store the active pair on the modal for conversions
  ccState = { from: home, to: local };
  fetchRates().then(rates => {
    const rEl = document.getElementById('cc-rate');
    if (!rEl) return;
    const rate = rates[local] / rates[home];
    rEl.innerHTML = `1 ${home} = ${rate.toFixed(3)} ${local} ${rates._live ? `· live (${rates._date})` : '· offline estimate'}`;
    ccConvert('a');
    // Preset chips
    const presets = [10, 25, 50, 100];
    document.getElementById('cc-presets').innerHTML = presets.map(p =>
      `<button onclick="ccPreset(${p})">${ccSymbol(home)}${p}</button>`
    ).join('');
  });
}

let ccState = { from: 'USD', to: 'EUR' };

function ccSymbol(cur) {
  return { USD: '$', EUR: '€', GBP: '£' }[cur] || '';
}

async function ccConvert(source) {
  const rates = await fetchRates();
  const a = document.getElementById('cc-input-a');
  const b = document.getElementById('cc-input-b');
  if (!a || !b) return;
  const rate = rates[ccState.to] / rates[ccState.from];
  if (source === 'a') {
    const v = parseFloat(a.value);
    b.value = isNaN(v) ? '' : (v * rate).toFixed(2);
  } else {
    const v = parseFloat(b.value);
    a.value = isNaN(v) ? '' : (v / rate).toFixed(2);
  }
}

function ccSwap() {
  const tmp = ccState.from; ccState.from = ccState.to; ccState.to = tmp;
  document.getElementById('cc-label-a').textContent = ccState.from;
  document.getElementById('cc-label-b').textContent = ccState.to;
  fetchRates().then(rates => {
    const rate = rates[ccState.to] / rates[ccState.from];
    const rEl = document.getElementById('cc-rate');
    if (rEl) rEl.innerHTML = `1 ${ccState.from} = ${rate.toFixed(3)} ${ccState.to} ${rates._live ? `· live (${rates._date})` : '· offline estimate'}`;
    document.getElementById('cc-presets').innerHTML = [10,25,50,100].map(p =>
      `<button onclick="ccPreset(${p})">${ccSymbol(ccState.from)}${p}</button>`
    ).join('');
    ccConvert('a');
  });
}

function ccPreset(val) {
  const a = document.getElementById('cc-input-a');
  if (a) { a.value = val; ccConvert('a'); }
}

/* ===========================================
   ADD / EDIT MANUAL ACTIVITY
   =========================================== */
const ACTIVITY_TYPES = [
  { key: 'glass', label: 'Food / drink' },
  { key: 'tour', label: 'Tour / activity' },
  { key: 'beach', label: 'Beach' },
  { key: 'museum', label: 'Sightseeing' },
  { key: 'shop', label: 'Shopping' },
  { key: 'ship', label: 'Boat' },
  { key: 'star', label: 'Other' },
];

function openAddActivity(dateStr, prefillTitle, fromIdeaId) {
  const t = trip();
  document.getElementById('app').classList.add('modal-open');
  document.getElementById('modal-head').innerHTML = `
    <div class="eyebrow">Add to itinerary</div>
    <div class="title">New activity</div>
    <div class="meta">Saved on this device · survives app updates</div>
  `;
  const dayOptions = t.days.map(d =>
    `<option value="${d.date}" ${d.date === dateStr ? 'selected' : ''}>${d.dayLabel} — ${d.title}</option>`
  ).join('');
  const typeOptions = ACTIVITY_TYPES.map(ty => `<option value="${ty.key}">${ty.label}</option>`).join('');
  document.getElementById('modal-body').innerHTML = `
    <div class="form-field">
      <label>What is it?</label>
      <input id="ma-title" type="text" value="${prefillTitle ? escapeAttr(prefillTitle) : ''}" placeholder="e.g. Sunset sailing tour">
    </div>
    <div class="form-row">
      <div class="form-field">
        <label>Day</label>
        <select id="ma-date">${dayOptions}</select>
      </div>
      <div class="form-field">
        <label>Time</label>
        <input id="ma-time" type="text" placeholder="2:00 pm / Evening">
      </div>
    </div>
    <div class="form-field">
      <label>Type</label>
      <select id="ma-type">${typeOptions}</select>
    </div>
    <div class="form-field">
      <label>Notes / details <span class="opt">(optional)</span></label>
      <input id="ma-meta" type="text" placeholder="e.g. Booked via Viator, meet at harbor">
    </div>
    <div class="form-field">
      <label>Location for map <span class="opt">(optional)</span></label>
      <input id="ma-loc" type="text" placeholder="e.g. Carpe Diem Beach Hvar">
    </div>
    <div class="form-field">
      <label>Reservation link <span class="opt">(optional)</span></label>
      <input id="ma-reserve" type="text" placeholder="Paste a booking URL, or leave blank">
    </div>
    <button class="form-save" onclick="saveNewActivity('${fromIdeaId || ''}')">Add to itinerary</button>
  `;
  document.getElementById('modal-overlay').classList.add('open');
  document.getElementById('modal').classList.add('open');
}

function escapeAttr(s) { return String(s).replace(/"/g, '&quot;'); }

function saveNewActivity(fromIdeaId) {
  const title = document.getElementById('ma-title').value.trim();
  if (!title) { document.getElementById('ma-title').focus(); return; }
  const date = document.getElementById('ma-date').value;
  const time = document.getElementById('ma-time').value.trim() || 'Anytime';
  const type = document.getElementById('ma-type').value;
  const meta = document.getElementById('ma-meta').value.trim();
  const loc = document.getElementById('ma-loc').value.trim();
  const reserve = document.getElementById('ma-reserve').value.trim();

  const act = { date, time, title, meta, icon: type, color: '', audience: 'family' };
  const links = [];
  if (loc) links.push({ type: 'map', query: loc });
  if (reserve) act.reserve = { platform: 'url', url: reserve };
  if (links.length) act.links = links;

  addManualActivity(act);
  if (fromIdeaId) saveIdeas(getIdeas().filter(i => i.id !== fromIdeaId));

  closeModal();
  show(state.currentScreen === 'ideas' ? 'ideas' : 'itinerary');
}

function confirmDeleteActivity(id) {
  deleteManualActivity(id);
  closeModal();
  show(state.currentScreen);
}

/* ===========================================
   IDEAS BOARD
   =========================================== */
function renderIdeas() {
  updateHeaders();
  const ideas = getIdeas();
  const host = document.getElementById('ideas-host');
  if (!ideas.length) {
    host.innerHTML = `<div class="empty"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18h6"/><path d="M10 21h4"/><path d="M12 3a6 6 0 0 1 3.6 10.8c-.5 .4 -.6 .9 -.6 1.2h-6c0 -.3 -.1 -.8 -.6 -1.2a6 6 0 0 1 3.6 -10.8z"/></svg><div class="t">No ideas yet</div><div class="s">Heard about a cool spot? Jot it above. Decide later.</div></div>`;
    return;
  }
  host.innerHTML = `<div class="idea-list">${ideas.map(renderIdeaCard).join('')}</div>`;
}

function renderIdeaCard(idea) {
  return `
    <div class="idea-card">
      <div class="idea-text">${idea.text}</div>
      <div class="idea-actions">
        <button onclick="searchIdea('${idea.id}')"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M21 21l-6 -6"/></svg> Search</button>
        <button onclick="promoteIdea('${idea.id}')"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14"/><path d="M5 12h14"/></svg> Add to plan</button>
        <button class="idea-del" onclick="deleteIdea('${idea.id}')" aria-label="Delete"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16"/><path d="M10 11v6"/><path d="M14 11v6"/><path d="M5 7l1 12a2 2 0 0 0 2 2h8a2 2 0 0 0 2 -2l1 -12"/><path d="M9 7v-3h6v3"/></svg></button>
      </div>
    </div>
  `;
}

function addIdea() {
  const input = document.getElementById('idea-input');
  const text = input.value.trim();
  if (!text) return;
  const ideas = getIdeas();
  ideas.unshift({ id: 'idea-' + Date.now(), text });
  saveIdeas(ideas);
  input.value = '';
  renderIdeas();
}

function deleteIdea(id) {
  saveIdeas(getIdeas().filter(i => i.id !== id));
  renderIdeas();
}

function searchIdea(id) {
  const idea = getIdeas().find(i => i.id === id);
  if (!idea) return;
  const t = trip();
  let viewIdx = (t.days || []).findIndex(d => d.date === state.viewingDate);
  if (viewIdx < 0) viewIdx = 0;
  const loc = t.days && t.days[viewIdx] ? (t.days[viewIdx].location || '').split('→').pop().trim() : '';
  const q = encodeURIComponent(loc ? `${idea.text} ${loc}` : idea.text);
  window.open(`https://www.google.com/search?q=${q}`, '_blank');
}

function promoteIdea(id) {
  const idea = getIdeas().find(i => i.id === id);
  if (!idea) return;
  const t = trip();
  let viewIdx = (t.days || []).findIndex(d => d.date === state.viewingDate);
  if (viewIdx < 0) viewIdx = 0;
  const dateStr = t.days && t.days[viewIdx] ? t.days[viewIdx].date : (t.days[0] && t.days[0].date);
  openAddActivity(dateStr, idea.text, id);
}

function closeModal() {
  document.getElementById('app').classList.remove('modal-open');
  document.getElementById('modal-overlay').classList.remove('open');
  document.getElementById('modal').classList.remove('open');
}

/* ===========================================
   NAVIGATION
   =========================================== */
function show(name) {
  closeModal();
  state.currentScreen = name;
  document.querySelectorAll('.screen').forEach(s => s.hidden = true);
  const el = document.getElementById('screen-' + name);
  if (el) el.hidden = false;

  document.querySelectorAll('.tab').forEach(t => t.classList.toggle('active', t.dataset.tab === name));
  // For trips & settings (no tab), keep current tab dimmed
  if (name === 'trips' || name === 'settings') {
    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  }

  if (name === 'home') renderHome();
  else if (name === 'itinerary') renderItinerary();
  else if (name === 'trip') renderTrip();
  else if (name === 'ideas') renderIdeas();
  else if (name === 'trips') renderTrips();
  else if (name === 'settings') renderSettings();
  window.scrollTo(0, 0);
}

function switchTrip(id) {
  if (!TRIPS[id]) return;
  state.currentTrip = id;
  state.viewingDate = null; // reset so the new trip picks its own default
  saveState();
  show('home');
}

/* Init */
show('home');

/* ===========================================
   SERVICE WORKER — registers the cache manager and auto-updates.
   When a new version is deployed, the SW detects it on next launch,
   installs it in the background, and reloads the page once to apply.
   =========================================== */
if ('serviceWorker' in navigator) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('./sw.js').then((reg) => {
      // Check for updates on each load.
      reg.update();
      // When a new SW takes control, reload once to get the fresh app.
      let reloaded = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (reloaded) return;
        reloaded = true;
        window.location.reload();
      });
      // If a new version is waiting, tell it to activate immediately.
      reg.addEventListener('updatefound', () => {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', () => {
          if (nw.state === 'installed' && navigator.serviceWorker.controller) {
            nw.postMessage('skipWaiting');
          }
        });
      });
    }).catch(() => {/* SW registration failed — app still works, just no offline cache */});
  });
}
</script>
